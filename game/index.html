<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>幕後操盤手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@900&display=swap">
<style>
/* Layout: one-screen war room — rival on top, the newsroom ticker in the middle, your hand fanned at the bottom. Election-night broadcast × tabloid extra. */
:root{
  --ink:#0a0c17; --panel:#141a30; --panel-2:#1c2442; --line:#2c3560;
  --paper:#f5ecd9; --muted:#9098bd;
  --red:#ff2e4d; --gold:#ffc83d; --cyan:#3fe0ff; --violet:#b07bff; --green:#47e6a0; --blue:#3f8cff; --dpp:#36d27a;
  --display:"Noto Serif TC","Songti TC",serif;
  --ui:"Noto Sans TC","PingFang TC",system-ui,sans-serif;
  --num:"Anton","Impact","Noto Sans TC",sans-serif;
  --cw:118px; --ch:168px;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--paper);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden;
  background:
    radial-gradient(120% 70% at 50% 110%, rgba(255,46,77,.18), transparent 60%),
    radial-gradient(90% 60% at 50% -10%, rgba(63,224,255,.12), transparent 60%),
    var(--ink)}
#bgimg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.16;filter:saturate(1.2) blur(1px);pointer-events:none}
#fx{position:absolute;inset:0;pointer-events:none;z-index:50}
#shake{position:absolute;inset:0;will-change:transform}
.screen{position:absolute;inset:0;padding-inline:16px}
#flash{position:absolute;inset:0;pointer-events:none;z-index:45;background:#fff;opacity:0}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:44;box-shadow:inset 0 0 0 0 rgba(255,46,77,0);transition:box-shadow .3s}
#vignette.hot{box-shadow:inset 0 0 120px 30px rgba(255,46,77,.45)}

/* ---------- title ---------- */
#screen-title{display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;overflow-y:auto;padding-block:16px;box-sizing:border-box}
.title-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;justify-items:center;width:100%;max-width:560px;min-width:0}
.kicker{font-size:13px;letter-spacing:.35em;color:var(--cyan);font-weight:700}
.logo{font-family:var(--display);font-size:clamp(56px,13vw,112px);line-height:.95;letter-spacing:.04em;text-wrap:balance;
  background:linear-gradient(180deg,#fff7df 0%,var(--gold) 55%,#c47a10 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 #6b1020) drop-shadow(0 18px 30px rgba(255,46,77,.45));animation:logoIn 1s cubic-bezier(.2,1.6,.4,1) both}
@keyframes logoIn{from{transform:scale(2.2) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.tag{font-size:17px;color:var(--paper);opacity:.9}
.tag b{color:var(--red)}
.cta{font-family:var(--display);font-size:24px;padding:16px 44px;border-radius:999px;color:#2a0710;
  background:linear-gradient(180deg,#fff2b8,var(--gold) 50%,#e09a12);box-shadow:0 6px 0 #8a4b05,0 14px 30px rgba(255,200,61,.35);transition:transform .12s}
.cta:hover{transform:translateY(-2px) scale(1.04)}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 #8a4b05}
.ghost{font-size:15px;padding:10px 22px;border-radius:999px;border:1px solid var(--line);background:rgba(20,26,48,.7)}
.ghost:hover{border-color:var(--cyan)}
.disclaimer{font-size:12px;color:var(--muted);max-width:40ch}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* ---------- game ---------- */
#screen-game{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr) auto auto;gap:6px;padding-block:8px}
.side{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:16px;background:rgba(20,26,48,.82);border:1px solid var(--line);position:relative}
.side.me{border-color:rgba(255,200,61,.35)}
.portrait{width:58px;height:58px;border-radius:50%;flex:none;overflow:hidden;position:relative;background:var(--panel-2);border:3px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:24px}
.me .portrait{border-color:var(--gold)}
.op .portrait{border-color:var(--red)}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.who{min-width:0;display:grid;gap:2px}
.who .nm{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .role{font-size:11px;color:var(--muted);letter-spacing:.08em}
.meters{flex:1;display:grid;gap:5px;min-width:0}
.meter{display:grid;grid-template-columns:34px 1fr 30px;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.bar{height:12px;border-radius:99px;background:#0b0f20;overflow:hidden;position:relative;border:1px solid #2a3157}
.fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:99px;transition:width .45s cubic-bezier(.2,1.4,.4,1)}
.buzz .fill{background:linear-gradient(90deg,#ff8a1f,var(--gold),#fff6c8);box-shadow:0 0 12px rgba(255,200,61,.7)}
.back .fill{background:linear-gradient(90deg,#7a1028,var(--red));box-shadow:0 0 10px rgba(255,46,77,.6)}
.meter .v{font-family:var(--num);font-size:16px;color:var(--paper);text-align:right;font-variant-numeric:tabular-nums}
.votes{text-align:right;flex:none;min-width:96px}
.votes .lbl{font-size:11px;color:var(--muted);letter-spacing:.12em}
.votes .n{font-family:var(--num);font-size:26px;line-height:1;color:var(--paper);font-variant-numeric:tabular-nums}
.me .votes .n{color:var(--gold)}
.shieldchip{position:absolute;left:52px;top:4px;background:var(--cyan);color:#04202a;font-family:var(--num);font-size:13px;padding:1px 7px;border-radius:99px;box-shadow:0 0 12px var(--cyan)}
.board{display:flex;gap:8px;min-height:62px;align-items:center;justify-content:center;flex-wrap:wrap}
.unit{width:52px;height:58px;border-radius:12px;position:relative;overflow:hidden;border:2px solid var(--violet);background:var(--panel-2);box-shadow:0 0 14px rgba(176,123,255,.45);animation:unitIn .5s cubic-bezier(.2,1.6,.4,1) both}
.unit img{width:100%;height:100%;object-fit:cover}
.unit .life{position:absolute;right:2px;bottom:2px;background:#000c;font-family:var(--num);font-size:12px;padding:0 5px;border-radius:6px}
.unit .ug{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:20px}
.unit.pulse{animation:upulse .5s}
@keyframes unitIn{from{transform:scale(0) rotate(-20deg)}to{transform:none}}
@keyframes upulse{50%{transform:scale(1.25);filter:brightness(1.8)}}

.center{display:grid;place-items:center;position:relative;min-height:0}
.hud{display:grid;justify-items:center;gap:8px;text-align:center}
.week{font-family:var(--display);font-size:clamp(20px,4vw,28px);letter-spacing:.06em}
.week small{display:block;font-family:var(--ui);font-size:12px;color:var(--muted);letter-spacing:.2em;font-weight:700}
.pollnext{font-size:12px;color:var(--cyan);letter-spacing:.1em}
.ticker{font-size:13px;color:var(--paper);opacity:.85;min-height:1.4em;max-width:46ch;text-wrap:balance}
#combo{position:absolute;right:4%;top:50%;transform:translateY(-50%);font-family:var(--num);text-align:center;pointer-events:none;opacity:0}
#combo .x{font-size:clamp(40px,8vw,72px);line-height:1;color:var(--gold);text-shadow:0 0 18px rgba(255,140,30,.9),0 4px 0 #8a1b10}
#combo .l{font-family:var(--ui);font-weight:900;font-size:13px;letter-spacing:.3em;color:var(--paper)}
#combo.pop{animation:comboPop .35s cubic-bezier(.2,1.8,.4,1)}
@keyframes comboPop{0%{transform:translateY(-50%) scale(1.8) rotate(-8deg)}100%{transform:translateY(-50%) scale(1)}}

.mebar{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;min-width:0}
.mebar > *{min-width:0}
#screen-game > *{min-width:0}
.funds{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c8,var(--gold) 45%,#a8620a);box-shadow:0 0 8px rgba(255,200,61,.6);transition:transform .2s,opacity .2s}
.coin.used{opacity:.18;transform:scale(.7);box-shadow:none}
.fundtxt{font-family:var(--num);font-size:18px;margin-left:6px}
.endturn{font-family:var(--display);font-size:18px;padding:12px 22px;border-radius:14px;color:#fff;background:linear-gradient(180deg,#ff5a72,var(--red) 60%,#a3102a);box-shadow:0 5px 0 #5c0616,0 10px 24px rgba(255,46,77,.35);transition:transform .1s}
.endturn:hover{transform:translateY(-2px)}
.endturn:active{transform:translateY(3px);box-shadow:0 2px 0 #5c0616}
.endturn:disabled{filter:grayscale(1) brightness(.6);cursor:default;transform:none}
.endturn.glow{animation:glow 1.2s infinite}
@keyframes glow{50%{box-shadow:0 5px 0 #5c0616,0 0 34px rgba(255,200,61,.9)}}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(20,26,48,.8);font-size:16px}

/* ---------- hand / cards ---------- */
#hand{display:flex;justify-content:center;align-items:flex-start;min-height:calc(var(--ch) + 22px);padding-top:6px;perspective:900px}
.card{width:var(--cw);height:var(--ch);flex:none;position:relative;border-radius:14px;padding:5px;margin:0 -10px;
  --rx:0deg;--ry:0deg;--mx:50%;--my:50%;--lift:0px;--fan:0deg;
  transform:translateY(var(--lift)) rotate(var(--fan)) rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;
  transition:transform .18s ease-out, filter .2s, margin .2s;cursor:pointer;
  background:var(--frame);box-shadow:0 10px 24px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.25)}
.card:hover,.card.focus{--lift:-26px;z-index:5;margin:0 4px;filter:brightness(1.12)}
.card.cant{filter:grayscale(.85) brightness(.55)}
.card{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
@media (hover:none){ .card:hover{--lift:0px;filter:none} .card.press{--lift:-14px;filter:brightness(1.15)} }
#hand .card.ctr{box-shadow:0 0 0 3px #16e0a0,0 0 18px rgba(22,224,160,.55),0 10px 24px rgba(0,0,0,.55)}
#hand .card .ctag{position:absolute;left:-7px;top:38px;z-index:4;width:28px;height:28px;display:grid;place-items:center;font-size:17px;border-radius:50%;border:2px solid #03140d;background:#16e0a0;color:#03140d;white-space:nowrap;box-shadow:0 2px 8px #000a;pointer-events:none}
.ichip em{font-style:normal;color:#16e0a0;margin-left:6px}
.ichip em.no{color:var(--muted)}
#peek{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:14px;padding:16px;overflow-y:auto;background:rgba(5,6,14,.82);backdrop-filter:blur(4px)}
#peek .card.big{cursor:default;--cw:min(260px,66vw,34vh)}
#peek .pkctr{max-width:34ch;font-size:14px;line-height:1.5;padding:8px 12px;border-radius:10px;background:rgba(22,224,160,.12);border:1px solid #16e0a0}
#peek .pkctr .pktag{color:#16e0a0;margin-right:8px;display:inline-flex;gap:4px;align-items:center}
#peek .pkbtns{display:flex;gap:10px;align-items:center}
#peek .pkno{color:var(--muted);font-size:14px}
.card.cant:hover{filter:grayscale(.6) brightness(.75)}
.card .in{position:absolute;inset:5px;border-radius:10px;overflow:hidden;background:#0d1124;display:grid;grid-template-rows:56% auto auto 1fr}
.card .art{position:relative;overflow:hidden;background:var(--frame)}
.card .art img{width:100%;height:100%;object-fit:cover;display:block}
.card .art .g{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:42px;color:#fff;text-shadow:0 3px 0 #0006}
.card .art img + .g{display:none}
.card .nm{font-family:var(--display);font-size:14px;text-align:center;padding:3px 2px 0;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ty{font-size:9px;text-align:center;letter-spacing:.3em;color:var(--tc);font-weight:900}
.card .ds{font-size:10.5px;line-height:1.3;text-align:center;padding:2px 6px;color:#d6d9ec}
.card .cost{position:absolute;left:-6px;top:-6px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;z-index:3;
  font-family:var(--num);font-size:20px;color:#3a1d00;background:radial-gradient(circle at 35% 30%,#fffbe0,var(--gold) 50%,#b06a08);box-shadow:0 3px 8px #000a,0 0 0 2px #5a3404}
.card .glare{position:absolute;inset:0;border-radius:14px;pointer-events:none;mix-blend-mode:overlay;opacity:0;transition:opacity .2s;
  background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.75),transparent 45%)}
.card:hover .glare{opacity:1}
.card .holo{position:absolute;inset:0;border-radius:14px;pointer-events:none;opacity:.0;mix-blend-mode:color-dodge;
  background:linear-gradient(115deg,transparent 20%,rgba(255,0,170,.35) 35%,rgba(0,255,230,.35) 50%,rgba(255,240,0,.3) 65%,transparent 80%);background-size:250% 250%;background-position:var(--mx) var(--my);transition:opacity .2s}
.card:hover .holo{opacity:.55}
.t-smear{--frame:linear-gradient(160deg,#ff6b7f,#b3122f 55%,#4a0614);--tc:var(--red)}
.t-unit{--frame:linear-gradient(160deg,#d3b3ff,#7a3fe0 55%,#2a0d5c);--tc:var(--violet)}
.t-boost{--frame:linear-gradient(160deg,#fff1b0,#e5a51a 55%,#6b3d02);--tc:var(--gold)}
.t-def{--frame:linear-gradient(160deg,#b8f6ff,#1fa6c9 55%,#073a4a);--tc:var(--cyan)}
.t-event{--frame:conic-gradient(from 0deg,#ff2e4d,#ffc83d,#47e6a0,#3fe0ff,#b07bff,#ff2e4d);--tc:#fff}
.card.flying{position:fixed;margin:0;z-index:60;pointer-events:none;transition:none}
.card.back-face .in{background:url(img/back.jpg?v=3) center/cover, linear-gradient(160deg,#5a1022,#1a0610)}
.card.back-face .in > *{visibility:hidden}

/* floating numbers */
.float{position:absolute;z-index:55;pointer-events:none;font-family:var(--num);font-size:34px;line-height:1;white-space:nowrap;
  text-shadow:0 3px 0 #000,0 0 18px currentColor;animation:floatUp 1.1s cubic-bezier(.2,1.4,.4,1) forwards}
.float.big{font-size:60px}
.float.txt{font-family:var(--ui);font-weight:900;font-size:20px}
@keyframes floatUp{0%{transform:translate(-50%,0) scale(.3);opacity:0}15%{transform:translate(-50%,-20px) scale(1.25);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-90px) scale(1);opacity:0}}

/* headline extra */
#extra{position:absolute;inset:0;z-index:58;display:grid;place-items:center;pointer-events:none}
.paper{pointer-events:auto;width:min(520px,88vw);background:var(--paper);color:#17110a;padding:18px 22px 20px;border-radius:4px;
  box-shadow:0 30px 80px #000c;transform-origin:center;animation:paperIn .55s cubic-bezier(.2,1.5,.4,1) both;position:relative}
.paper .mast{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px double #17110a;padding-bottom:6px;margin-bottom:10px}
.paper .mast b{font-family:var(--display);font-size:30px;color:#c4101f;letter-spacing:.1em}
.paper .mast span{font-size:11px;letter-spacing:.2em}
.paper h2{font-family:var(--display);font-size:clamp(24px,5.5vw,36px);line-height:1.2;margin:0;text-wrap:balance}
.paper p{margin:8px 0 0;font-size:13px;color:#4a3f30}
.paper .stamp{position:absolute;right:14px;bottom:-18px;font-family:var(--display);font-size:22px;color:#c4101f;border:3px solid #c4101f;padding:2px 10px;transform:rotate(-12deg);background:var(--paper);animation:stampIn .4s .35s cubic-bezier(.2,1.8,.4,1) both}
@keyframes paperIn{from{transform:scale(.1) rotate(-540deg);opacity:0}to{transform:rotate(-2deg);opacity:1}}
@keyframes stampIn{from{transform:scale(3) rotate(-12deg);opacity:0}to{transform:rotate(-12deg);opacity:1}}

/* modal / overlays */
.overlay{position:absolute;inset:0;z-index:57;display:grid;place-items:center;background:rgba(5,6,14,.94);padding-inline:16px;overflow:auto}
.panel{width:min(640px,100%);display:grid;gap:16px;justify-items:center;text-align:center;padding-block:24px}
.panel h3{font-family:var(--display);font-size:clamp(28px,6vw,44px);margin:0;text-wrap:balance}
.panel p{margin:0;color:#d4d7ea}
.choices{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;perspective:900px}
.choices .card{margin:0}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;width:100%}
.vs .p{display:grid;justify-items:center;gap:8px}
.vs .portrait{width:min(150px,30vw);height:min(150px,30vw);border-width:4px}
.vs .bigvs{font-family:var(--num);font-size:clamp(48px,10vw,84px);color:var(--red);text-shadow:0 0 30px rgba(255,46,77,.8);animation:vsIn .6s cubic-bezier(.2,1.8,.4,1) both}
@keyframes vsIn{from{transform:scale(4);opacity:0}}
.taunt{font-family:var(--display);font-size:18px;background:var(--paper);color:#1a1209;padding:10px 16px;border-radius:14px;max-width:34ch;position:relative}
.office{font-size:13px;letter-spacing:.3em;color:var(--cyan);font-weight:900}

/* election night */
.tv{width:min(680px,100%);background:linear-gradient(180deg,#0f1838,#0a0f24);border:1px solid #2e3d7a;border-radius:18px;padding:18px;display:grid;gap:14px;box-shadow:0 0 60px rgba(63,224,255,.15)}
.tvtop{display:flex;justify-content:space-between;align-items:center}
.live{background:var(--red);color:#fff;font-weight:900;font-size:12px;padding:3px 10px;border-radius:4px;letter-spacing:.2em;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.5}}
.race{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;text-align:left}
.race .portrait{width:52px;height:52px}
.race .track{height:30px;background:#060a1a;border-radius:8px;overflow:hidden;position:relative}
.race .rb{position:absolute;inset:0 auto 0 0;width:0}
.race.me .rb{background:linear-gradient(90deg,#b36b05,var(--gold))}
.race.op .rb{background:linear-gradient(90deg,#7a0d22,var(--red))}
.race .cnt{font-family:var(--num);font-size:28px;font-variant-numeric:tabular-nums}
.seal{font-family:var(--display);font-size:clamp(56px,14vw,110px);color:var(--red);border:8px solid var(--red);border-radius:22px;padding:0 24px;transform:rotate(-10deg);text-shadow:0 0 30px rgba(255,46,77,.6);animation:sealIn .5s cubic-bezier(.2,1.8,.4,1) both;background:rgba(10,12,23,.6)}
.seal.lose{color:#8b93b8;border-color:#8b93b8;text-shadow:none}
@keyframes sealIn{from{transform:scale(5) rotate(-30deg);opacity:0}to{transform:rotate(-10deg);opacity:1}}
.score{font-family:var(--num);font-size:clamp(44px,10vw,80px);color:var(--gold);line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(255,200,61,.6)}
.namebox{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.namebox input{font:inherit;font-size:16px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#0b1022;color:var(--paper);width:min(220px,60vw)}
.lb{width:min(460px,100%);display:grid;gap:4px;text-align:left}
.lb .r{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:rgba(28,36,66,.7);font-size:14px}
.lb .r.mine{outline:1px solid var(--gold)}
.lb .rk{font-family:var(--num);font-size:18px;color:var(--muted)}
.lb .r:nth-child(1) .rk{color:var(--gold)}
.lb .r:nth-child(2) .rk{color:#d6dcef}
.lb .r:nth-child(3) .rk{color:#e3955a}
.lb .nm2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .nm2 small{color:var(--muted);margin-left:6px}
.lb .sc{font-family:var(--num);font-size:18px;font-variant-numeric:tabular-nums}
.lbnote{font-size:12px;color:var(--muted)}
.help{text-align:left;display:grid;gap:8px;font-size:14px;max-width:52ch}
.help b{color:var(--gold)}

.newsline{font-size:14px;font-weight:900;color:#17110a;background:var(--paper);padding:6px 14px;border-radius:4px;transform:rotate(-1deg);text-wrap:balance}
.camps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:100%}

<script>
/* =========================================================
   AUDIO — everything synthesized, no files
   ========================================================= */
const AU = {
  ctx:null, master:null, sfx:null, mus:null, nbuf:null, muted:false,
  init(){
    if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    const C = window.AudioContext||window.webkitAudioContext; if(!C) return;
    const ctx = this.ctx = new C();
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4; comp.connect(ctx.destination);
    this.master = ctx.createGain(); this.master.gain.value = this.muted?0:0.9; this.master.connect(comp);
    this.sfx = ctx.createGain(); this.sfx.gain.value=.85; this.sfx.connect(this.master);
    this.mus = ctx.createGain(); this.mus.gain.value=.32; this.mus.connect(this.master);
    const len = ctx.sampleRate*1.5, b = ctx.createBuffer(1,len,ctx.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    this.nbuf=b;
    // reverb send + announcer voice bus
    this.rev=ctx.createConvolver(); const il=ctx.sampleRate*1.4, ib=ctx.createBuffer(2,il,ctx.sampleRate);
    for(let c=0;c<2;c++){ const d=ib.getChannelData(c); for(let i=0;i<il;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/il,3.2); }
    this.rev.buffer=ib; this.revIn=ctx.createGain(); this.revIn.gain.value=.5; this.revIn.connect(this.rev); this.rev.connect(this.master);
    const send=ctx.createGain(); send.gain.value=.22; this.sfx.connect(send); send.connect(this.revIn);
    this.vox=ctx.createGain(); this.vox.gain.value=1.25; this.vox.connect(this.master); const vs=ctx.createGain(); vs.gain.value=.25; this.vox.connect(vs); vs.connect(this.revIn);
    VOICE.preload();
  },
  setMuted(m){ this.muted=m; if(this.master) this.master.gain.setTargetAtTime(m?0:.9,this.ctx.currentTime,.05); },
  pad(f,dur,vol=.04,att=.6,type='sawtooth',when=0){
    if(!this.ctx) return; const t=this.ctx.currentTime+when;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain(), lp=this.ctx.createBiquadFilter();
    o.type=type; o.frequency.value=f; lp.type='lowpass'; lp.frequency.setValueAtTime(600,t); lp.frequency.linearRampToValueAtTime(2600,t+att+.2);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+att); g.gain.setValueAtTime(vol,t+Math.max(att,dur-.5)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(lp); lp.connect(g); g.connect(this.sfx); o.start(t); o.stop(t+dur+.05);
  },
  tone(f,dur,type='sine',vol=.3,when=0,to=null,dest){
    if(!this.ctx) return; const t=this.ctx.currentTime+when;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(to) o.frequency.exponentialRampToValueAtTime(Math.max(20,to),t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.008); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(dest||this.sfx); o.start(t); o.stop(t+dur+.05);
  },
  noise(dur,vol=.3,ft='bandpass',f=1000,when=0,fto=null,dest,q=1){
    if(!this.ctx) return; const t=this.ctx.currentTime+when;
    const s=this.ctx.createBufferSource(); s.buffer=this.nbuf;
    const fl=this.ctx.createBiquadFilter(); fl.type=ft; fl.frequency.setValueAtTime(f,t); fl.Q.value=q; if(fto) fl.frequency.exponentialRampToValueAtTime(fto,t+dur);
    const g=this.ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(fl); fl.connect(g); g.connect(dest||this.sfx); s.start(t,Math.random()); s.stop(t+dur+.05);
  }
};
const PENTA=[0,2,4,7,9]; const note=(i,base=523.25)=>base*Math.pow(2,(PENTA[((i%5)+5)%5]+12*Math.floor(i/5))/12);
const SFX = {
  hover(){ AU.tone(2200,.035,'triangle',.05); },
  play(){ AU.noise(.28,.22,'bandpass',500,0,4200); AU.tone(160,.14,'sine',.45,0,55); },
  flip(){ AU.noise(.12,.18,'highpass',3000,0,9000); AU.tone(700,.06,'square',.06); },
  hit(c=1){ const p=1+Math.min(c,8)*.08; AU.tone(240*p,.14,'square',.16,0,70); AU.noise(.14,.45,'lowpass',2600*p,0,300); AU.tone(90,.22,'sine',.7,0,38); },
  crit(){ AU.tone(60,.9,'sawtooth',.32,0,28); AU.noise(1,.35,'bandpass',5000,0,300,undefined,.6); AU.tone(110,.5,'sine',.8,0,30); for(let i=0;i<4;i++) AU.tone(note(10-i,880),.18,'square',.08,.05+i*.06); },
  gain(c=1){ for(let i=0;i<3;i++) AU.tone(note(c+i*2),.16,'triangle',.18,i*.055); AU.tone(note(c+6),.3,'sine',.08,.17); },
  combo(c){ AU.tone(note(c+3,659),.22,'square',.12); AU.tone(note(c+5,659),.22,'triangle',.12,.05); },
  shield(){ AU.tone(1320,.45,'sine',.18); AU.tone(1980,.4,'sine',.1,.02); AU.tone(2640,.3,'sine',.06,.04); },
  bad(){ AU.tone(320,.32,'sawtooth',.18,0,110); AU.tone(330,.32,'sawtooth',.12,0,118); },
  heal(){ AU.tone(660,.2,'sine',.14,0,990); },
  coin(i=0){ AU.tone(988+i*25,.05,'square',.07); AU.tone(1319+i*25,.08,'square',.06,.04); },
  tick(i){ AU.tone(600+i*14,.03,'square',.045); },
  unit(){ AU.tone(220,.3,'sawtooth',.15,0,440); AU.tone(440,.25,'square',.08,.08,880); },
  poof(){ AU.noise(.35,.25,'lowpass',1500,0,120); },
  fire(){ AU.noise(1.2,.4,'lowpass',800,0,3000); AU.tone(80,.8,'sawtooth',.2,0,40); },
  extra(){ AU.noise(.5,.3,'bandpass',800,0,6000,undefined,.8); AU.tone(196,.25,'square',.15,.25); AU.tone(294,.4,'square',.15,.38); },
  deal(i){ AU.noise(.07,.16,'highpass',4000+i*400,i*.06); },
  fanfare(){ const seq=[[523,659,784],[587,740,880],[659,830,988],[784,988,1175,1568]];

  lose(){ [392,370,349,330].forEach((f,i)=>AU.tone(f,i===3?1:.35,'sawtooth',.14,i*.36,i===3?f*.92:null)); },
  vs(){ AU.tone(55,1,'sawtooth',.3,0,40); AU.noise(.8,.4,'bandpass',300,0,4000); AU.tone(880,.15,'square',.1,.1); },
  tally(i){ AU.tone(500+i*9,.04,'square',.05); },
  click(){ AU.tone(900,.05,'square',.07); },
  cheer(n=1){ for(let i=0;i<10+n*4;i++) AU.noise(.18+Math.random()*.25,.05+Math.random()*.06,'bandpass',900+Math.random()*2200,Math.random()*.7,null,undefined,3);
    AU.tone(330,.5,'sawtooth',.05,.05,520); AU.tone(392,.5,'sawtooth',.04,.12,640); },
  boo(n=1){ [104,117,131,139].forEach((f,i)=>{ AU.tone(f,.9,'sawtooth',.07+n*.015,i*.03,f*.82); }); AU.noise(.8,.12,'lowpass',500,0,250); },
  thump(){ AU.tone(70,.2,'sine',.9,0,38); AU.noise(.08,.3,'lowpass',900); },
  heart(){ AU.tone(62,.14,'sine',.9,0,40); AU.tone(58,.16,'sine',.7,.2,36); },
  surge(){ AU.tone(220,.45,'sawtooth',.1,0,1760); AU.noise(.45,.2,'highpass',1500,0,9000); for(let i=0;i<5;i++) AU.tone(note(5+i*2),.18,'triangle',.12,.25+i*.05); },
  rise(){ AU.tone(440,.18,'triangle',.08,0,1320); },
  slam(){ AU.tone(55,.35,'sine',1,0,30); AU.noise(.25,.45,'lowpass',2400,0,200); AU.tone(180,.1,'square',.12,0,60); },
  riser(d=2.2){ AU.noise(d,.22,'highpass',300,0,9000); AU.tone(110,d,'sawtooth',.1,0,880); AU.tone(165,d,'sawtooth',.07,0,1320); AU.tone(55,d,'sine',.3,0,110); },
  rip(){ AU.noise(.4,.6,'bandpass',3500,0,500,undefined,1.4); AU.noise(.12,.5,'highpass',6000); AU.tone(220,.2,'sawtooth',.12,0,60); },

const MUS = {
  on:false, step:0, next:0, timer:null, bpm:108, intensity:0, mood:'game',
  start(){ if(!AU.ctx||this.on) return; this.on=true; this.next=AU.ctx.currentTime+.1; this.timer=setInterval(()=>this.sched(),25); },
  stop(){ this.on=false; clearInterval(this.timer); },
  sched(){ const a=AU.ctx; while(this.next < a.currentTime+.15){ this.playStep(this.step,this.next-a.currentTime); this.next += 60/this.bpm/4; this.step=(this.step+1)%64; } },
  playStep(s,w){
    const D=AU.mus, i=s%16, bar=Math.floor(s/16);
    if(i%4===0) setTimeout(()=>beat(i===0),Math.max(0,w*1000));
    const roots=this.mood==='title'?[110,87.3,130.8,98]:[110,87.3,98,82.4];
    const r=roots[bar];
    const I=this.intensity;
    if(i%4===0){ AU.tone(150,.22,'sine',.9,w,40,D); }
    if(I>=2 && (i===6||i===14)) AU.tone(150,.18,'sine',.6,w,40,D);
    if(i===4||i===12){ AU.noise(.16,.35,'bandpass',1800,w,null,D,.7); AU.tone(220,.08,'triangle',.15,w,120,D); }
    if(I>=1 ? true : i%2===1) AU.noise(.04,i%2? .12:.07,'highpass',8000,w,null,D);
    if(i%2===0){ const oct=(i%8===6)?2:1; AU.tone(r*oct,.18,'sawtooth',.16,w,null,D); AU.tone(r*oct*.5,.2,'square',.1,w,null,D); }
    if(I>=1){ const pat=[0,null,3,null,5,7,null,5,0,null,3,5,null,7,8,null]; const p=pat[i];
      if(p!==null){ const f=r*4*Math.pow(2,[0,3,5,7,10,12,15,17,19][p]/12); AU.tone(f,.12,'square',.05,w,null,D); } }
    if(I>=2 && i%4===2){ AU.tone(r*8,.08,'triangle',.04,w,null,D); }
  }
};

const escH=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KW_RE=/([+\-−]?\d+\s*(?:點\s*)?(?:聲量|反感)|(?:對手|自己|你的|他的)?(?:聲量|得票|票數|反感|護盾|答非所問|閃避|暗樁|抹黑|炎上|資金|連擊|攻擊力?|聲量腰斬)(?:\s*[+\-−×]\s*\d+%?)?|[+\-−]?\d+\s*(?:點\s*)?(?:聲量|反感)|[+\-−]?\d+\s*票)/g;
const KW_CLS=[['聲量','buzz'],['票','vote'],['反感','back'],['炎上','back'],['護盾','shield'],['答非所問','dodge'],['閃避','dodge'],['暗樁','unit'],['抹黑','atk'],['資金','coin'],['連擊','up'],['攻擊','up']];

function draw(side,n){
  for(let i=0;i<n;i++){
    if(!side.deck.length){ if(!side.discard.length) return; side.deck=shuffle(side.discard); side.discard=[]; }
    if(side.hand.length>=8){ side.discard.push(side.deck.pop()); continue; }
    side.hand.push(side.deck.pop());
  }
}

/* 觸控：短按出牌、長按預覽（不出牌）。滑動或長按後放開都不會誤觸 */
function bindPress(el,onTap,onHold){
  let t=null, held=false, sx=0, sy=0;
  const cancel=()=>{ clearTimeout(t); t=null; };
  el.addEventListener('pointerdown',e=>{ if(e.button>0) return; held=false; sx=e.clientX; sy=e.clientY;
    if(e.pointerType!=='mouse'){ cancel(); el.classList.add('press'); t=setTimeout(()=>{ t=null; held=true; el.classList.remove('press'); if(navigator.vibrate) navigator.vibrate(12); onHold(); },380); } });
  el.addEventListener('pointermove',e=>{ if(t&&Math.hypot(e.clientX-sx,e.clientY-sy)>12){ cancel(); held=true; el.classList.remove('press'); } });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>{ cancel(); el.classList.remove('press'); }));
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('click',e=>{ if(held){ held=false; e.preventDefault(); e.stopPropagation(); return; } onTap(); });
}

/* 反制提示：看對手意圖＋場面，替手牌標出「這張現在能反制什麼」 */
const DEF_IDS=['clarify','b_qa','g_bear'], WASH_IDS=['apology','b_baoli','blame','g_wanted'], PUSH_IDS=['n_bot','factcheck','g_airport'];
const isSmear=id=>{ const a=ADV[id]||{}; return !!(a.dmg||a.fake); };
/* 對手每張意圖牌：要用哪類牌反制（match 判斷手牌是否符合） */
function counterFor(id){
  const a=ADV[id]||{}, c=CARDS[id], me=B.me;
  if(a.dmg||a.fake) return (me.shield||me.dodge)?{verb:'已經有防禦',ic:'shield',done:1,match:()=>false,none:'你已經有防禦，放心進攻'}:{verb:'擋',ic:'shield',tag:'擋抹黑',match:x=>DEF_IDS.includes(x),none:'手上沒防禦牌，先衝聲量'};
  if(c.unit) return {verb:'下回合抓',ic:'grab',tag:'留著抓',match:x=>x==='factcheck',none:'沒查核牌，暗樁會一直加分'};
  if(DEF_IDS.includes(id)) return {verb:'趁現在打',ic:'atk',tag:'趁現在打',match:isSmear,none:'沒抹黑牌，這回合先造勢'};
  if(id==='lastnight'||a.gain||a.pollx) return {verb:'壓他聲量',ic:'atk',tag:'壓聲量',match:isSmear,none:'沒抹黑牌，自己衝更高'};
  if(a.opBack||a.blame) return {verb:'先洗反感',ic:'wash',tag:'洗反感',match:x=>WASH_IDS.includes(x),none:'沒洗白牌，抹黑先停手'};
  return {verb:'',ic:'buzz',match:()=>false,none:'直接拉票擋不了，衝自己的分'}; }
function counterTag(id){
  if(!B||B.turnOwner!=='me') return null;
  const inc=incoming(), me=B.me, op=B.op, fire=FIRE(), it=B.intent||[];
  // 先看場面上的機會（不用等對手意圖）
  if(id==='factcheck'&&op.units.length) return {tag:'抓暗樁',ic:'grab',why:'對手場上有暗樁，這張能把它抓掉，還讓他反感 +2。'};
  if(id==='g_anytime'&&(op.shield||op.dodge)) return {tag:'破防',ic:'pierce',why:'對手開了防禦，這張能一次戳破再打。'};
  if(WASH_IDS.includes(id)&&me.backlash>=fire-3) return {tag:'洗反感',ic:'wash',why:`你的反感 ${me.backlash}，炎上門檻 ${fire}。先洗掉，免得聲量腰斬。`};
  if(PUSH_IDS.includes(id)&&op.backlash>=fire-3) return {tag:'推炎上',ic:'back',why:`對手反感 ${op.backlash}，再推 ${fire-op.backlash} 點他就炎上、聲量腰斬。`};
  // 再看能不能反制對手準備出的牌
  for(const x of it){ const k=counterFor(x); if(k.tag&&k.match(id)){
    const why={擋抹黑:`對手準備出「${CARDS[x].n}」抹黑你約 ${Math.round(inc.dmgSum)} 點，先出這張擋下來。`,留著抓:`對手要放暗樁「${CARDS[x].n}」，這張留到下回合把它抓掉。`,
      趁現在打:`對手下回合要開「${CARDS[x].n}」防守，現在抹黑不會被擋。`,壓聲量:`對手準備用「${CARDS[x].n}」衝聲量，先把他打下來。`,洗反感:`對手要出「${CARDS[x].n}」讓你反感上升，先洗掉。`}[k.tag];
    return {tag:k.tag,ic:k.ic,why}; } }
  return null; }
function intentCounter(id){
  const k=counterFor(id); const hits=B.me.hand.filter(k.match);
  if(hits.length) return `用「${CARDS[hits[0]].n}」${k.verb}`;
  return k.none; }
function applyCounterTags(){
  const cards=[...document.querySelectorAll('#hand .card')];
  cards.forEach((el,i)=>{ el.querySelector('.ctag')?.remove(); el.classList.remove('ctr'); const ct=counterTag(B.me.hand[i]); if(!ct) return;

function bindTilt(el){

  el.addEventListener('pointermove',e=>{ const r=el.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;

}

function planAI(){

  const hand=o.hand.slice(), plan=[];

  B.intent=plan; renderIntent(); }

let DB=null, USER=null, UID=null, LB=[], LB_STATE='connecting';
(async()=>{
  try{
    if(!window.claude||!window.claude.use){ LB_STATE='off'; renderLB(); return; }
    USER=await window.claude.use('user'); DB=await window.claude.use('db');
    UID=USER?await USER.id():null;
    if(!DB){ LB_STATE='off'; renderLB(); return; }
    LB_STATE='live';
    DB.collection('scores').orderBy('score','desc').limit(200).onSnapshot(s=>{ LB=s.docs.map(d=>Object.assign({id:d.id},d.data())); renderLB(); },
      ()=>{ LB_STATE='off'; renderLB(); });
  }catch(e){ LB_STATE='off'; renderLB(); }
})();
async function submitScore(name,score,office,camp){
  if(!DB||!UID) return 'local';
  try{ const ref=DB.doc('scores/'+UID); const cur=await ref.get();
    if(cur.exists && (cur.data().score||0)>=score){ await ref.update({name}); return 'kept'; }
    await ref.set({name,score,office,camp,ts:Date.now()}); return 'ok';
  }catch(e){ return e&&e.code==='invalid_argument'?'local':'err'; }
}

    left.forEach((id,i)=>{ if(CARDS[id].c>st.funds) return; const eff=cardValue(id,st)/Math.max(1,CARDS[id].c*.55+.45); if(eff>bv){ bv=eff; best=i; } });

function adviceLines(order,inc){

  else { const parts=[]; if(inc.dmgSum) parts.push(`抹黑約 −${Math.round(inc.dmgSum)} 聲量`); if(inc.units.length) parts.push('放暗樁'); if(inc.votes) parts.push(`直接拉 ${Math.round(inc.votes)} 票`); if(inc.myBackUp) parts.push(`讓你反感 +${inc.myBackUp}`);
    L.push({k:'intel',t:`對手準備：${(B.intent||[]).map(name).join('、')}${parts.length?'。預計 '+parts.join('、'):''}。`}); }
  if(me.backlash>=fire-2&&me.backlash<fire) L.push({k:'warn',t:`你的反感 ${me.backlash}，離炎上只差 ${fire-me.backlash}！先洗反感${has('b_baoli')?'（寶立答B 最划算）':has('apology')?'（道歉影片）':has('blame')?'（甩鍋）':''}，抹黑先停手。`});
  if(op.backlash>=fire-3&&op.backlash<fire&&(has('n_bot')||has('factcheck')||has('g_airport'))) L.push({k:'go',t:`對手反感 ${op.backlash}，再推 ${fire-op.backlash} 點就炎上、聲量腰斬。用${has('n_bot')?'指控機器人洗版':has('factcheck')?'檢舉查核':'松機遷移'}推他一把！`});
  if(inc.hits.length){ const big=(B.intent||[]).filter(BIG_HIT);
    if(has('b_qa')&&big.length) L.push({k:'def',t:`對手要出「${name(big[0])}」這種重擊，先打問A答BCD，整發閃掉（連會心一擊都擋）。`});
    else if(has('clarify')) L.push({k:'def',t:`對手會抹黑約 ${Math.round(inc.dmgSum)} 點，先開澄清記者會（護盾 +4）。${(B.intent||[]).includes('trolls')?'網軍是連打，護盾比閃避划算。':''}`});
    else if(me.dodge||me.shield) L.push({k:'def',t:`你已經有${me.dodge?'答非所問':'護盾'}，這回合可以放心進攻。`}); }
  const opDef=(B.intent||[]).filter(id=>['b_qa','clarify','g_bear'].includes(id));
  if(opDef.length) L.push({k:'go',t:`對手準備開「${name(opDef[0])}」防守，但要到他的回合才生效。趁現在先抹黑，下回合再打就會被擋。`});
  if(inc.units.length&&!has('factcheck')) L.push({k:'plan',t:`對手要放「${name(inc.units[0])}」，有檢舉查核的話留到下回合抓掉它。`});
  if(op.units.length&&has('factcheck')) L.push({k:'go',t:'對手場上有暗樁，檢舉查核會抓掉費用最高的那個，還讓他反感 +2。'});
  if((op.shield||op.dodge)&&has('g_anytime')) L.push({k:'go',t:'對手有護盾或答非所問，隨時可辯可以一次全部戳破再進攻。'});
  if((B.intent||[]).includes('lastnight')) L.push({k:'warn',t:'對手要開「選前一夜」，會把（聲量−反感）×2 直接變票！現在壓他的聲量、拉高他的反感最有效。'});
  if(settleSoon()) L.push({k:'plan',t:`這週結束就民調結算。${me.backlash>=2?`你的反感 ${me.backlash} 會直接扣票，${has('b_baoli')?'寶立答B 能把它全部變成聲量。':has('blame')?'甩鍋能一進一出差 6 票。':has('apology')?'道歉影片先洗掉。':'能洗就先洗。'}`:'聲量會直接換成票，盡量衝高、守住。'}`});
  else if(order.some(id=>CARDS[id].unit)) L.push({k:'plan',t:'下週才結算，這週適合先放暗樁累積，之後每回合自動加分。'});
  if(order.length>=3) L.push({k:'combo',t:`照順序出能疊連擊：便宜和不吃加成的先出，最大的「${name(order[order.length-1])}」留到最後（×${(1+.2*(order.length-1)).toFixed(1)}）。`});
  if(order.includes('b_script')) L.push({k:'combo',t:'講稿機的攻擊 +2 是每一下都加，先打它再接抹黑。'});
  if(!order.length) L.push({k:'plan',t:'這回合沒有划算的牌，直接結束回合把資金留給下週。'});
  return L.slice(0,4); }
function updateAdvice(){
  const box=$('#advisor'); if(!box) return; document.querySelectorAll('#hand .card').forEach(c=>{ c.classList.remove('adv','adv1'); delete c.dataset.step; });

function placeAdvisor(){
  const box=$('#advisor'); if(!box||box.hidden) return;

/* =========================================================
   DAILY NEWS EVENTS — news.json is refreshed every morning
   ========================================================= */
let NEWS=[];
const NEWS_TYPES=['buzz','backlash','votes','shield'], NEWS_TARGETS=['blue','green','both','leader','trailer'];
function validNews(e){ return e&&typeof e.headline==='string'&&e.headline.length<=28&&(!e.sub||(typeof e.sub==='string'&&e.sub.length<=36))&&e.effect
  &&NEWS_TYPES.includes(e.effect.type)&&NEWS_TARGETS.includes(e.effect.target)&&Number.isInteger(e.effect.value)&&e.effect.value!==0&&Math.abs(e.effect.value)<=5; }
(async()=>{ try{ const r=await fetch('news.json?d='+new Date().toISOString().slice(0,10)); if(!r.ok) return; const j=await r.json();
  NEWS=(Array.isArray(j.events)?j.events:[]).filter(validNews).slice(-30); renderNewsTicker(); }catch(e){} })();
function renderNewsTicker(){ const t=$('#newsTicker'); if(!t||!NEWS.length) return; const e=NEWS[NEWS.length-1]; t.hidden=false; t.innerHTML='<b>今日時事</b><span></span>'; t.querySelector('span').textContent=e.headline+(e.sub?'｜'+e.sub:''); }
function newsTargets(tg){ const campSide=c=>RUN.camp===c?B.me:B.op;
  if(tg==='blue'||tg==='green') return [campSide(tg)]; if(tg==='both') return [B.me,B.op];
  const lead=B.me.votes===B.op.votes?null:(B.me.votes>B.op.votes?B.me:B.op); if(!lead) return [B.me,B.op];
  return [tg==='leader'?lead:(lead===B.me?B.op:B.me)]; }
async function newsEvent(){
  if(!NEWS.length||B.newsDone) return; B.newsDone=true;
  const k=Math.min(10,NEWS.length), e=NEWS[NEWS.length-1-Math.floor(Math.random()*Math.random()*k)];
  const ef=e.effect, label={buzz:'聲量',backlash:'反感',votes:'票數',shield:'護盾'}[ef.type];
  const who=newsTargets(ef.target).map(s=>s===B.me?RUN.cand.cand:s.name).join('、');
  await extra(e.headline,`${e.sub?e.sub+'｜':''}時事事件：${who} ${label} ${ef.value>0?'+':''}${ef.value}`,'時事');
  for(const side of newsTargets(ef.target)){ const A=api(side,side===B.me?B.op:B.me), v=ef.value;
    if(ef.type==='buzz') await A.gain(v,true);
    else if(ef.type==='backlash') A.back(v);
    else if(ef.type==='votes'){ if(v>0) await A.votes(v); else { side.votes=Math.max(0,side.votes+v); renderSides(); } }
    else if(ef.type==='shield'&&v>0) A.shield(v); }
  await resolveFires(); renderSides(); }
